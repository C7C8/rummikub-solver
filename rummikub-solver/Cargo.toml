[package]
name = "rummikub-solver"
description = "CLI Rummikub solver that accepts your hand and the state of the board, and calculates the optimal move."
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.46", features = ["derive", "wrap_help"] }
log = { version = "0.4.27", features = ["kv"] }
log4rs = "1.3.0"

librummikub = { path = "../librummikub"}
librummikub-optimization = { path = "../librummikub-optimization"}
